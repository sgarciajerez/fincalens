services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fincalens
      POSTGRES_USER: fincalens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - fincalens-data:/var/lib/postgresql/data
volumes:
  fincalens-data:
