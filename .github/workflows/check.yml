name: Application checks

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx prettier --check 'apps/**/*.{ts,css,html,json}' 'packages/**/*.{ts,json}' 'scripts/*.ts' 'tests/*.ts' '*.json' 'vite.config.ts' 'vitest.config.ts'
